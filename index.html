<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Booking System</title>
    <!-- Тематична іконка ноутбука на вкладці браузера -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💻</text></svg>">
    <style>
        :root {
            --blue: #1a56db;
            --blue-hover: #1e429f;
            --blue-light: #ebf5ff;
            --bg: #f0f4ff;
            --text: #1f2937;
            --gray-light: #f3f4f6;
            --gray-border: #e5e7eb;
            --green: #31c48d;
            --green-hover: #057a55;
            --red: #f98080;
            --red-hover: #e02424;
            --orange: #f59e0b;
            --orange-light: #fef3c7;
            --disabled: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; line-height: 1.5; }

        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); width: 100%; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gray-light); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { color: var(--blue); font-size: 22px; }
        h2 { font-size: 18px; margin-bottom: 15px; color: var(--blue); }

        .btn { background: var(--blue); color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; white-space: nowrap; }
        .btn:hover { background: var(--blue-hover); }
        .btn-danger { background: var(--red); }
        .btn-danger:hover { background: var(--red-hover); }
        .btn-warning { background: var(--orange); }
        .btn-warning:hover { background: #d97706; }
        .btn-outline { background: transparent; border: 1px solid var(--blue); color: var(--blue); }
        .btn-outline:hover { background: var(--blue-light); }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid var(--gray-border); border-radius: 6px; font-size: 15px; outline: none; }
        select:focus, input:focus { border-color: var(--blue); }

        .hidden { display: none !important; }
        .flex-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--gray-border); padding-bottom: 10px; }
        .tab { padding: 8px 16px; cursor: pointer; border-radius: 6px; font-weight: 500; font-size: 14px; }
        .tab.active { background: var(--blue); color: white; }

        /* Календар */
        .week-selector { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: var(--gray-light); padding: 10px; border-radius: 8px; flex-wrap: wrap; gap: 10px; }
        .days-grid { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; justify-content: space-between; }
        
        .day-card { background: white; border: 2px solid var(--gray-border); padding: 10px 4px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; align-items: center; min-height: 125px; flex: 1; min-width: 0; }
        .day-card.active { border-color: var(--blue); background: var(--blue-light); }
        .day-card .date-sub { font-size: 11px; color: #6b7280; margin-bottom: 5px; }
        .day-card div:first-child { font-size: 14px; font-weight: bold; }

        /* Статус плашка */
        .status-badge { display: block; padding: 4px 4px; border-radius: 6px; font-size: 10px; font-weight: bold; margin-top: auto; width: 100%; max-width: 100%; white-space: normal !important; word-wrap: break-word !important; word-break: break-word !important; line-height: 1.3; text-align: center; }
        .badge-office { background: #def7ec; color: #03543f; }
        .badge-remote { background: #edf2f7; color: #4a5568; }
        .badge-waiting { background: var(--orange-light); color: #92400e; border: 1px solid #fcd34d; }
        .badge-unfulfilled { background: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }

        /* Схема офісу */
        .office-map-container { background: var(--gray-light); padding: 15px; border-radius: 8px; margin-top: 15px; }
        .map-wrapper { max-width: 100%; background: white; padding: 15px; border-radius: 12px; border: 2px solid var(--blue); position: relative; }
        .map-labels { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #6b7280; margin-bottom: 15px; border-bottom: 1px dashed var(--gray-border); padding-bottom: 8px; }
        .row-scheme { display: grid; gap: 10px; margin-bottom: 25px; }
        .section-title { font-size: 12px; font-weight: bold; color: #4b5563; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

        .seat { padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 12px; cursor: pointer; border: 1px solid var(--gray-border); transition: all 0.2s; background: var(--green); color: white; display: flex; flex-direction: column; justify-content: center; min-height: 55px; word-break: break-word; }
        .seat:hover:not(.taken):not(.disabled) { background: var(--green-hover); }
        .seat.taken { background: var(--disabled); color: var(--text); cursor: not-allowed; font-weight: normal; }
        .seat.taken span { font-size: 10px; display: block; color: #555; font-style: italic; }
        .seat.disabled { background: var(--gray-light); color: #9ca3af; border-style: dashed; cursor: not-allowed; }
        
        .seat.my-booking { background: var(--blue) !important; color: white !important; }
        .seat.my-booking span { color: #ffffff !important; font-weight: bold !important; opacity: 0.95; }

        /* Блоки інформації */
        .info-panel { background: #f8fafc; border: 1px solid var(--gray-border); border-radius: 8px; padding: 15px; margin-top: 25px; font-size: 13px; color: #4b5563; }
        .info-panel h3 { font-size: 14px; color: var(--blue); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .info-panel ul { list-style-type: none; }
        .info-panel li { margin-bottom: 8px; padding-left: 15px; position: relative; line-height: 1.4; }
        .info-panel li::before { content: "•"; color: var(--blue); font-weight: bold; position: absolute; left: 0; }

        .mobile-boundary { display: none; text-align: center; font-size: 11px; font-weight: bold; color: #6b7280; padding: 6px; background: #f3f4f6; border-radius: 6px; border: 1px dashed #d1d5db; margin: 4px 0; letter-spacing: 1px; }

        @media (max-width: 768px) {
            .days-grid { flex-direction: column; }
            .day-card { min-height: auto; flex-direction: row; justify-content: space-between; padding: 12px; min-width: 100%; }
            .day-card .date-sub { margin-bottom: 0; margin-left: 5px; }
            .status-badge { width: auto; max-width: 60%; margin-top: 0; }
            
            .row-scheme { grid-template-columns: 1fr !important; gap: 8px; }
            .map-labels { display: none; }
            .mobile-boundary { display: block; }
        }

        .alert-box { max-width: 100%; margin: 10px auto; padding: 12px; border-radius: 6px; font-weight: bold; font-size: 13px; text-align: center; line-height: 1.4; }
        .alert-danger { background: #fde8e8; color: #9b1c1c; border: 1px solid #f8b4b4; }
        .alert-warning { background: #feecdc; color: #b43403; border: 1px solid #fdbb93; }
        .alert-info { background: #e1effe; color: #1e429f; border: 1px solid #b3d1ff; }

        .remote-info-box { max-width: 100%; margin: 15px auto 0 auto; background: #edf2f7; padding: 12px; border-radius: 8px; border-left: 4px solid #4a5568; font-size: 13px; }
        .queue-info-box { max-width: 100%; margin: 10px auto 0 auto; background: var(--orange-light); padding: 12px; border-radius: 8px; border-left: 4px solid var(--orange); font-size: 13px; color: #78350f; }

        .admin-table-wrapper { overflow-x: auto; width: 100%; margin-top: 15px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
        .admin-table th, .admin-table td { border: 1px solid var(--gray-border); padding: 8px; text-align: left; }
        .admin-table th { background: var(--gray-light); }
        .sync-indicator { font-size: 11px; color: #6b7280; text-align: right; margin-top: 5px; }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

            </div>
